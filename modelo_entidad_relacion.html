<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo Entidad-Relación - Base de Datos Banco API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #030712;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Top Navigation Bar */
        header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-badge {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
        .title-group h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .title-group p {
            font-size: 12px;
            color: #94a3b8;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn {
            background: rgba(30, 41, 59, 0.8);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }
        .btn:hover {
            background: rgba(51, 65, 85, 0.9);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: 1px solid #3b82f6;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
        }
        .btn-emerald {
            background: linear-gradient(135deg, #059669, #047857);
            border: 1px solid #10b981;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
        }
        .btn-emerald:hover {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }
        /* Canvas Workspace */
        #viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
            cursor: grab;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
        }
        #viewport:active {
            cursor: grabbing;
        }
        #svg-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            transition: transform 0.05s ease-out;
        }
        /* Floating HUD */
        .hud {
            position: absolute;
            bottom: 24px;
            right: 24px;
            display: flex;
            gap: 8px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 50;
        }
        .hud-btn {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            background: transparent;
            border: none;
            color: #cbd5e1;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .hud-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .hud-indicator {
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            font-family: monospace;
        }
    </style>
</head>

    <script>
        const viewport = document.getElementById('viewport');
        const wrapper = document.getElementById('svg-wrapper');
        const zoomIndicator = document.getElementById('zoom-indicator');
        const svgEl = wrapper.querySelector('svg');

        let scale = 0.85;
        let panX = 40;
        let panY = 20;
        let isDragging = false;
        let startX, startY;

        function updateTransform() {
            wrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            zoomIndicator.textContent = Math.round(scale * 100) + '%';
        }

        function zoomIn() {
            scale = Math.min(scale * 1.2, 3.0);
            updateTransform();
        }

        function zoomOut() {
            scale = Math.max(scale / 1.2, 0.3);
            updateTransform();
        }

        function resetView() {
            const vw = viewport.clientWidth;
            const vh = viewport.clientHeight;
            const sw = 1880;
            const sh = 1380;
            scale = Math.min((vw - 80) / sw, (vh - 80) / sh, 1.0);
            panX = (vw - sw * scale) / 2;
            panY = (vh - sh * scale) / 2;
            updateTransform();
        }

        viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('.hud')) return;
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const newScale = Math.min(Math.max(scale * delta, 0.3), 3.0);
            
            // Zoom towards mouse
            const rect = viewport.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            scale = newScale;
            updateTransform();
        }, { passive: false });

        // Initialize fit
        window.addEventListener('DOMContentLoaded', resetView);
        window.addEventListener('resize', resetView);

        // Download SVG
        function downloadSVG() {
            const svgData = new XMLSerializer().serializeToString(svgEl);
            const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'modelo_entidad_relacion_banco.svg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // Download PNG
        function downloadPNG() {
            const svgData = new XMLSerializer().serializeToString(svgEl);
            const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);
            const img = new Image();
            
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const scaleDPI = 2; // High-resolution export
                canvas.width = 1880 * scaleDPI;
                canvas.height = 1380 * scaleDPI;
                const ctx = canvas.getContext('2d');
                ctx.scale(scaleDPI, scaleDPI);
                ctx.drawImage(img, 0, 0);
                
                const pngUrl = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.href = pngUrl;
                link.download = 'modelo_entidad_relacion_banco.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };
            img.src = url;
        }
    </script>
