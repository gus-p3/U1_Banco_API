plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.sonarqube' version '7.5.0.8588'
	id 'jacoco'
}

group = 'com.intrumentoev'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.0"
	}
}

dependencies {
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Documentación y APIs
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

	// Bases de Datos (Hibernate y Lettuce los administra Spring Boot)
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Seguridad & JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// Utilerías Apache Commons & Mappers
	implementation 'org.apache.commons:commons-lang3:3.12.0'
	implementation 'commons-io:commons-io:2.18.0'
	implementation 'org.apache.httpcomponents.client5:httpclient5:5.4.1'
	implementation 'org.mapstruct:mapstruct:1.6.3'

	// Serialización

	// Utilerías Google

	// Mail / XML
	implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.3'
	implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'

	// NLP

	// Lombok y Processors de Anotaciones
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

	// Pruebas
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'com.h2database:h2:2.2.220'
	testImplementation 'org.springframework.security:spring-security-test'

	// Servidor web embebido (Tomcat) para mantener la app activa escuchando HTTP
	implementation 'org.springframework.boot:spring-boot-starter-web'
}

// Código sin lógica de negocio propia (generado, DTOs, entidades, configuración) excluido de la cobertura
def coverageExclusions = [
	'**/*MapperImpl.class',        // generado por MapStruct
	'**/model/**',                 // DTOs de request/response
	'**/entity/**',                // entidades JPA (Lombok)
	'**/DemoApplication.class',
	'**/config/ConfigDB.class',
	'**/config/FlywayConfig.class',
	'**/config/RedisConfig.class',
	'**/config/OpenApiConfig.class',
	'**/config/JacksonConfig.class',
	'**/config/DemoUserInitializer.class'
]

jacoco {
	toolVersion = '0.8.12'
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		csv.required = false
		html.required = true
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: coverageExclusions)
		}))
	}
}

jacocoTestCoverageVerification {
	dependsOn test
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: coverageExclusions)
		}))
	}
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				minimum = 0.80
			}
		}
	}
}

sonar {
	properties {
		property 'sonar.projectKey', 'Api_Gesto_Pago'
		property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
		property 'sonar.coverage.exclusions',
				coverageExclusions.collect { it.replace('.class', '.java') }.join(',')
	}
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

tasks.named('check') {
	dependsOn jacocoTestCoverageVerification
}
