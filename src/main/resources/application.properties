spring.application.name=banco
server.port=${PORT:8080}

# Conexión a Base de Datos (Soporte automático para Railway, Docker y Local)
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:banco}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:linux}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.cloud.config.enabled=false

# INEGI Catálogos Geográficos API Base URL
inegi.api.base-url=https://gaia.inegi.org.mx/wscatgeo/v2
inegi.api.connect-timeout=5000
inegi.api.read-timeout=10000

# Configuración de Negocio Bancario
bank.account.initial-balance=1000.00

# Configuración de Timeouts para Feign Client / HTTP
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Redis (Host y Puerto dinámicos con fallback)
spring.data.redis.host=${REDISHOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${REDISPORT:${REDIS_PORT:6379}}

# Documentación Interactiva Swagger UI / OpenAPI 3
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Control de Sesión en el Servidor (5 minutos = 300 segundos de inactividad)
server.session.inactivity-limit-seconds=300

# Expiración de Access Token JWT (5 minutos = 300 segundos)
jwt.access-token-expiration-seconds=300

# Deshabilitar coerción automática de strings a números/escalares
spring.jackson.mapper.allow-coercion-of-scalars=false

# Rechazar propiedades no reconocidas o campos desconocidos en el JSON body (evita Mass Assignment)
spring.jackson.deserialization.fail-on-unknown-properties=true

# Excluir campos nulos de todas las respuestas JSON globalmente
spring.jackson.default-property-inclusion=non_null

# Configuración de GestoPago
gestopago.auth.url=${GESTOPAGO_AUTH_URL:https://gestopago.portalventas.net}
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:GPS83-TPV-17}
gestopago.auth.password=${GESTOPAGO_PASSWORD:12345678}
gestopago.auth.bearer-token=${GESTOPAGO_BEARER_TOKEN:}


# Cifrado del payload (AES-256-CBC). En producción define GESTOPAGO_SECRET_KEY / GESTOPAGO_IV;
# el valor por defecto es el par de PRUEBA publicado en la documentación de GestoPago.
gestopago.crypto.secret-key=${GESTOPAGO_SECRET_KEY:HPo7OLqB4Fkk4E2yGOtwqw8H5fHR9kNx67OR4g4UdlA=}
gestopago.crypto.iv=${GESTOPAGO_IV:p5ldmBPdd/9pjC0bDC/nSg==}

# Token de GestoPago: dura 24 h, se reutiliza y solo se renueva si tiene más de N horas (o ante un 403)
gestopago.auth.token-max-age-hours=23

# Transacciones de pago (sendTx / confirmTx)
gestopago.tx.unidad=${GESTOPAGO_UNIDAD:086}
gestopago.tx.api-key=${GESTOPAGO_API_KEY:}
gestopago.tx.connect-timeout-ms=5000
gestopago.tx.read-timeout-ms=65000
# Segundos que deben pasar desde sendTx antes de llamar a confirmTx
gestopago.tx.espera-confirmacion-segundos=62
# confirmTx solo es válido 24 h después de sendTx
gestopago.tx.vigencia-confirmacion-horas=24
# Códigos de sendTx que significan "producto/servicio no existe" (se llena al conocerlos en la bitácora)
gestopago.tx.codigos-producto-inexistente=
# Códigos de confirmTx que significan "transacción NO aplicada" (70 según la documentación)
gestopago.tx.codigos-no-aplicada=70
